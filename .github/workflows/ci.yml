name: CI

# Runs on every push and every pull request. A red check here means the
# contract was broken — read the failure, it names the file and the fix.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    # CI must never depend on a third-party market feed being up, and must never
    # send traffic to one from a shared runner. Fixture mode makes the build
    # deterministic and offline; feeds/http.py raises if anything tries to open
    # a socket in this mode.
    env:
      DATA_MODE: fixtures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Contract validation
        run: python validate.py
      - name: Grounding tests
        run: python tests/test_grounding.py
      - name: Synthesis tests
        run: python tests/test_synthesis.py
      - name: Agent tests
        run: python tests/test_agents.py
      - name: Filing agent tests
        run: python tests/test_filing_agent.py
      - name: Feed layer tests
        run: python tests/test_feeds.py
      - name: Indicator tests
        run: python tests/test_indicators.py
