<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INVESTIGATOR — Multi-Agent Financial Intelligence</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <h1>Investi<b>gator</b></h1>
      <span>Financial Intelligence</span>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="analysis">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></svg>
        Stock Analysis</button>
      <button class="nav-item" data-view="reasoning">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        AI Reasoning</button>
      <button class="nav-item" data-view="portfolio">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 11h18M8 6V4h8v2"/></svg>
        Portfolio</button>
      <button class="nav-item" data-view="integrity">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 4 6v6c0 5 3.4 8.4 8 9 4.6-.6 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>
        Research Integrity</button>
    </nav>

    <div class="side-foot">
      <div class="tag" style="padding:0 12px 10px">Session</div>
      <div class="nav-item" style="cursor:default">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span class="tag" id="foot-note" style="letter-spacing:.1em">3 agents · parallel</span>
      </div>
    </div>
  </aside>

  <div>
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <span class="tag">NSE market data &amp; SEBI filings</span>
        <span class="case-no" id="case-no">CASE — — — —</span>
      </div>
      <div style="display:flex;align-items:center;gap:14px">
        <span class="tag">Reading as</span>
        <div class="switch" id="profiles"></div>
      </div>
    </header>

    <div id="app">
      <div class="view"><div class="loading">
        <span class="tag">Dispatching agents in parallel</span><div class="scan"></div></div></div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Exhibit">
  <div class="drawer-head">
    <span class="tag" style="color:var(--amber)">Exhibit — source document</span>
    <button id="drawer-close" aria-label="Close exhibit" class="tag" style="letter-spacing:.16em;color:var(--paper-dim)">CLOSE ✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
