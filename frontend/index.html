<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUREON — Financial Intelligence</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <h1>AUREON</h1>
      <span>Financial Intelligence</span>
    </div>
    <nav class="nav">
      <button class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></svg>Stock Analysis</button>
      <button class="nav-item" data-scroll="reasoning"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>AI Reasoning</button>
      <button class="nav-item" data-scroll="portfolio"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>Portfolio</button>
      <button class="nav-item" data-scroll="integrity"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 4 6v6c0 5 3.4 8.4 8 9 4.6-.6 8-4 8-9V6z"/></svg>Research Integrity</button>
    </nav>
    <div style="margin-top:auto;font-size:11px" class="muted">
      Multi-agent reasoning over NSE market data and SEBI filings.
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="muted" style="font-size:12px;letter-spacing:.06em;text-transform:uppercase">Investor profile</div>
        <div style="font-size:12px" class="muted">Same data. Different investor. Different answer.</div>
      </div>
      <div class="profile-switch" id="profiles"></div>
    </div>

    <div id="app"><div class="loading"><div class="spinner"></div>Running agents…</div></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h2 style="font-size:16px;display:flex;gap:8px;align-items:center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      Citation Source
    </h2>
    <button id="drawer-close" aria-label="Close" style="font-size:22px;line-height:1;color:var(--on-surface-variant)">&times;</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
