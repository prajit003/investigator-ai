<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INVESTIGATOR — Multi-Agent Financial Intelligence</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="masthead">
  <div>
    <h1 class="wordmark">Investi<b>gator</b></h1>
    <div class="masthead-sub">
      <span class="tag">Multi-agent financial intelligence</span>
      <span class="tag">·</span>
      <span class="tag">NSE market data &amp; SEBI filings</span>
      <span class="case-no" id="case-no">CASE — — — — —</span>
    </div>
  </div>
  <div>
    <div class="tag" style="margin-bottom:7px">Reading as</div>
    <div class="switch" id="profiles"></div>
  </div>
</header>

<div id="app">
  <div class="body">
    <div class="loading">
      <span class="tag">Dispatching agents in parallel</span>
      <div class="scan"></div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Exhibit">
  <div class="drawer-head">
    <span class="tag" style="color:var(--amber)">Exhibit — source document</span>
    <button id="drawer-close" aria-label="Close exhibit"
            style="font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;color:var(--paper-dim)">CLOSE ✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
